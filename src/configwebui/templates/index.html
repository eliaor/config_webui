<!DOCTYPE html>
<html lang="en-US">

<head>
    <title>{{ title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="/static/icon/favicon-96x96.png" sizes="96x96">
    <link rel="shortcut icon" type="image/x-icon" href="/static/icon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Editor">
    <link rel="manifest" href="/static/icon/site.webmanifest">

    <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/fontawesome.all.css">
    <link rel="stylesheet" type="text/css" href="/static/css/index.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top" id="navbar">
        <div class="container-fluid" id="navbar-content">
            <a class="navbar-brand" id="navbar-brand" href="/">
                <span><i class="fas fa-laptop-code"></i></span>
                <span>{{ title }}</span>
            </a>
            <button class="navbar-toggler" id="navbar-toggle" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbar-menu">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="navbar-menu-content">
                    <li class="nav-item mx-lg-1 my-2 my-lg-0" id="navbar-admin-section">
                        <div id="admin-guest-ui" class="d-flex align-items-center" {% if is_admin %}style="display: none !important;"{% endif %}>
                            <button class="btn btn-outline-secondary btn-sm" id="admin-login-btn" type="button"
                                data-bs-toggle="modal" data-bs-target="#adminLoginModal" title="Admin Login to edit readonly fields">
                                <span><i class="fas fa-lock me-1"></i></span>
                                <span>Admin Login</span>
                            </button>
                        </div>
                        <div id="admin-auth-ui" class="d-flex align-items-center" {% if not is_admin %}style="display: none !important;"{% endif %}>
                            <span class="badge bg-warning text-dark me-2 py-2 px-2" id="admin-badge">
                                <i class="fas fa-user-shield me-1"></i> Admin Mode
                            </span>
                            <button class="btn btn-outline-danger btn-sm" id="admin-logout-btn" type="button" title="Logout from Admin Mode">
                                <span><i class="fas fa-sign-out-alt me-1"></i></span>
                                <span>Logout</span>
                            </button>
                        </div>
                    </li>
                    <li class="nav-item mx-lg-1 btn-group dropdown my-2 my-lg-0" id="navbar-menu-actions">
                        <button class="btn btn-primary save-action" type="button" title="Save changes">
                            <span><i class="fas fa-save"></i></span>
                            <span>Save</span>
                        </button>
                        <button class="btn btn-primary dropdown-toggle dropdown-toggle-split" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="visually-hidden">Toggle Dropdown</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="navbarmenu-actions-dropdown">
                            <li>
                                <button class="dropdown-item menu-primary btn-primary save-action" type="button">
                                    <span><i class="fas fa-save text-primary"></i></span>
                                    <span>Save changes</span>
                                </button>
                            </li>
                            <li class="dropdown-divider"></li>
                            <li>
                                <button class="dropdown-item menu-danger btn-danger terminate-action" type="button">
                                    <span><i class="fas fa-power-off text-danger"></i></span>
                                    <span>Terminate editor</span>
                                </button>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3 mb-5" id="main-page-container">
        <div class="row justify-content-center" id="main-page">
            <div class="col-12 col-lg-10 col-xl-8" id="main-page-content">
                <!-- Flash messages -->
                <div class="row" id="flash-messages-container">
                    <div class="col" id="flash-messages-content">
                        {% for category, message in get_flashed_messages(with_categories=true) %}
                        <div class="alert alert-{{ category | safe }} alert-dismissible fade show" role="alert">
                            <div>{{ message | safe }}</div>
                            <button class="btn-close" type="button" title="Dismiss" data-bs-dismiss="alert"
                                aria-label="Dismiss"></button>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- Presets selection -->
                <div class="row" id="preset-container">
                    <div class="col" id="preset">
                        <div class="card card-body mb-3 bg-light" id="preset-card">
                            <div class="row align-items-center" id="preset-heading">
                                <div class="col-12 col-md-4 mb-2 mb-md-0" id="preset-title">
                                    <h2 class="h4 mb-0">
                                        <span>Presets</span>
                                        <span class="ms-1"><i class="fas fa-sliders-h text-primary"></i></span>
                                    </h2>
                                </div>
                                <div class="col-12 col-md-8 d-flex align-items-center gap-2" id="preset-controls">
                                    <select class="form-select" id="preset-select" aria-label="Select preset">
                                        {% for preset_name in presets %}
                                        <option value="{{ preset_name }}">{{ preset_name }}</option>
                                        {% endfor %}
                                    </select>
                                    <button type="button" class="btn btn-primary text-nowrap" id="apply-preset-btn" title="Apply this preset to the config">
                                        <span><i class="fas fa-file-import me-1"></i></span>
                                        <span>Apply Preset</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Config Editor -->
                <div class="row" id="config-container">
                    <div class="col-12 col-lg-8 mb-2" id="config-form">
                        <div class="row" id="config-form-heading">
                            <div class="col" id="config-form-title">
                                <h2>
                                    <span>Editor</span>
                                    <span><i class="fas fa-edit"></i></span>
                                    <span class="spinner-border text-primary" role="status"
                                        id="config-form-loading-icon" style="display: none;"></span>
                                </h2>
                            </div>
                        </div>
                        <div class="collapse" id="config-form-content">
                            <div class="row" id="config-form-edit"></div>
                            <div class="row justify-content-between justify-content-lg-end form-actions mt-3"
                                id="config-form-actions">
                                <div class="col-5 col-lg-4 col-xl-3">
                                    <button class="btn btn-primary w-100 save-action" type="button" title="Save">
                                        <span><i class="fas fa-save"></i></span>
                                        <span>Save</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="collapse show" id="config-form-content-placeholder">
                            <div class="row" id="config-form-edit-placeholder">
                                <div>
                                    <p class="placeholder-wave" aria-hidden="true">
                                        <span class="h3 placeholder col-1"></span>
                                    </p>
                                    <div class="card card-body mb-3 bg-light" aria-hidden="true">
                                        <p class="placeholder-wave"><span class="h4 placeholder col-2"></span></p>
                                        <p class="placeholder-glow"><input class="form-control placeholder" type="text"
                                                disabled></p>
                                        <p class="placeholder-wave"><span class="placeholder col-5"></span></p>
                                        <p class="placeholder-wave"><span class="h4 placeholder col-3"></span></p>
                                        <p class="placeholder-glow"><input class="form-control placeholder" type="text"
                                                disabled></p>
                                        <p class="placeholder-wave"><span class="h4 placeholder col-1"></span></p>
                                        <p class="placeholder-glow"><input class="form-control placeholder" type="text"
                                                disabled></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-4 mb-2" id="json-code">
                        <div class="row" id="json-code-heading">
                            <div class="col-10" id="json-code-title">
                                <h2>
                                    <span>JSON</span>
                                    <span><i class="fas fa-code"></i></span>
                                </h2>
                            </div>
                            <div class="col-2 mb-1 mb-lg-0 d-flex justify-content-end align-items-start"
                                id="json-code-toggle">
                                <button class="btn btn-outline-primary" type="button" id="json-code-expand"
                                    title="Expand json"><i class="fas fa-expand"></i></button>
                                <button class="btn btn-primary" type="button" id="json-code-collapse"
                                    title="Collapse json" style="display:none;"><i class="fas fa-compress"></i></button>
                            </div>
                        </div>
                        <div class="row collapse" id="json-code-content">
                            <div class="col">
                                <textarea id="json-code-edit" class="form-control code-text" title="Json"
                                    placeholder="After the editor is loaded, the corresponding json string will show here."
                                    readonly></textarea>
                            </div>
                        </div>
                        <div class="row collapse show" id="json-code-content-placeholder">
                            <div class="col d-flex justify-content-center align-items-center">
                                <button class="btn btn-secondary bg-light w-100" disabled>
                                    <span class="h3">Hidden</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal fade" id="adminLoginModal" tabindex="-1" aria-labelledby="adminLoginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adminLoginModalLabel">
                        <i class="fas fa-user-shield text-primary me-2"></i>Admin Login
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">
                        Logging in as Admin unlocks all read-only fields, allowing you to edit and overwrite restricted variables.
                    </p>
                    <div id="admin-login-error" class="alert alert-danger d-none py-2" role="alert"></div>
                    <form id="admin-login-form" onsubmit="return false;">
                        <input type="text" name="username" value="admin" autocomplete="username" style="display: none;" aria-hidden="true" tabindex="-1">
                        <div class="mb-3">
                            <label for="admin-password-input" class="form-label">Admin Password</label>
                            <input type="password" class="form-control" id="admin-password-input"
                                placeholder="Enter admin password" autocomplete="current-password" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="admin-login-submit-btn">
                        <i class="fas fa-sign-in-alt me-1"></i> Login
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/jquery.slim.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/jsoneditor.min.js"></script>
    <script src="/static/js/index.js"></script>
</body>

</html>
